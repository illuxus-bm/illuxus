<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />

    <!-- Primary meta -->
    <title>illuxus — events, communities, and webinars</title>
    <meta name="description" content="Run branded events, sell tickets, check attendees in via QR, host live webinars, and grow communities — all in one platform." />
    <meta name="keywords" content="event management, ticketing platform, event registration, webinar platform, QR check-in, attendee management, event communities, sponsor management, speaker management, event analytics, illuxus" />
    <meta name="author" content="illuxus" />
    <meta name="application-name" content="illuxus" />
    <meta name="generator" content="illuxus" />
    <meta name="theme-color" content="#0b0b1a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Canonical -->
    <link rel="canonical" href="https://illuxus.com/" />

    <!-- Favicons + manifest -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/icon.svg" color="#0b0b1a" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- iOS / iPadOS launch splash screens. Using the OG image as a static
         dark splash prevents the white flash on cold launch from the home
         screen. The browser picks the closest match for the active device. -->
    <link rel="apple-touch-startup-image" href="/og-image.png"
          media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/og-image.png"
          media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/og-image.png"
          media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/og-image.png"
          media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/og-image.png"
          media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/og-image.png"
          media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/og-image.png"
          media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/og-image.png"
          media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/og-image.png"
          media="(device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="illuxus" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="msapplication-TileColor" content="#0b0b1a" />
    <meta name="msapplication-TileImage" content="/favicon-192.png" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="illuxus" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://illuxus.com/" />
    <meta property="og:title" content="illuxus — events, communities, and webinars" />
    <meta property="og:description" content="Run branded events, sell tickets, check attendees in via QR, host live webinars, and grow communities — all in one platform." />
    <meta property="og:image" content="https://illuxus.com/og-image.png" />
    <meta property="og:image:secure_url" content="https://illuxus.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="illuxus — events, communities, and webinars" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="illuxus — events, communities, and webinars" />
    <meta name="twitter:description" content="Run branded events, sell tickets, check attendees in via QR, host live webinars, and grow communities — all in one platform." />
    <meta name="twitter:image" content="https://illuxus.com/og-image.png" />
    <meta name="twitter:image:alt" content="illuxus — events, communities, and webinars" />

    <!-- Preconnect to upstream hosts so first paint is faster -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://dcfygmgjqldvynbvmwdy.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://dcfygmgjqldvynbvmwdy.supabase.co" />

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=Comfortaa:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Structured data: Organization + WebSite (sitelinks search box) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://illuxus.com/#organization",
            "name": "illuxus",
            "url": "https://illuxus.com/",
            "logo": {
              "@type": "ImageObject",
              "url": "https://illuxus.com/favicon-512.png",
              "width": 512,
              "height": 512
            },
            "description": "Run branded events, sell tickets, check attendees in via QR, host live webinars, and grow communities — all in one platform."
          },
          {
            "@type": "WebSite",
            "@id": "https://illuxus.com/#website",
            "url": "https://illuxus.com/",
            "name": "illuxus",
            "publisher": { "@id": "https://illuxus.com/#organization" },
            "inLanguage": "en-US",
            "potentialAction": {
              "@type": "SearchAction",
              "target": {
                "@type": "EntryPoint",
                "urlTemplate": "https://illuxus.com/events?q={search_term_string}"
              },
              "query-input": "required name=search_term_string"
            }
          },
          {
            "@type": "SoftwareApplication",
            "name": "illuxus",
            "operatingSystem": "Web",
            "applicationCategory": "BusinessApplication",
            "url": "https://illuxus.com/",
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "USD"
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <!-- Apply saved theme class before React hydrates to avoid flash of wrong theme. -->
    <script>
      (function(){
        var s = localStorage.getItem('app-theme');
        var t = s === 'dark' || s === 'light' ? s :
          (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        if (t === 'dark') document.documentElement.classList.add('dark');
        document.documentElement.style.colorScheme = t;
      })();
    </script>
    <div id="root"></div>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
