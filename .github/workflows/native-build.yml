# Compiles the Android and iOS apps on pull requests that can break them,
# so a native build failure shows up on the pull request and not on release
# day. Unsigned builds only: no secrets are needed or used.
name: Native build

on:
  pull_request:
    paths:
      - android/**
      - ios/**
      - capacitor.config.ts
      - package.json
      - bun.lock
      - src/lib/native/**
      - scripts/check-app-release.mjs
      - .github/workflows/native-build.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: bun install --frozen-lockfile

      - name: Check app release configuration
        run: bun run app:check

      - name: Build the app and sync Android
        env:
          VITE_SUPABASE_URL: https://ci.invalid
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-only-build-placeholder
        run: |
          bun run build:app
          bunx cap sync android

      # Release variant, unsigned (no ILLUXUS_UPLOAD_* here): the same code
      # path the store build takes.
      - name: Build release APK and App Bundle (unsigned)
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease bundleRelease

  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build the app and sync iOS
        env:
          VITE_SUPABASE_URL: https://ci.invalid
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-only-build-placeholder
        run: |
          bun run build:app
          bunx cap sync ios

      - name: Build for device (unsigned)
        run: |
          xcodebuild -quiet \
            -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination generic/platform=iOS \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO build
