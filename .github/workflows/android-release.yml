name: Android release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-android:
    name: Build and publish Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check tag, version, and release secrets
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          ILLUXUS_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ILLUXUS_UPLOAD_KEYSTORE_BASE64 }}
          ILLUXUS_UPLOAD_STORE_PASSWORD: ${{ secrets.ILLUXUS_UPLOAD_STORE_PASSWORD }}
          ILLUXUS_UPLOAD_KEY_ALIAS: ${{ secrets.ILLUXUS_UPLOAD_KEY_ALIAS }}
          ILLUXUS_UPLOAD_KEY_PASSWORD: ${{ secrets.ILLUXUS_UPLOAD_KEY_PASSWORD }}
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          app_version="$(sed -n 's/^versionName=//p' android/version.properties)"
          if [ "$tag_version" != "$app_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app version $app_version."
            exit 1
          fi
          for name in VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY ILLUXUS_UPLOAD_KEYSTORE_BASE64 ILLUXUS_UPLOAD_STORE_PASSWORD ILLUXUS_UPLOAD_KEY_ALIAS ILLUXUS_UPLOAD_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Configure the $name GitHub Actions secret before publishing an Android release."
              exit 1
            fi
          done

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check app release configuration
        run: bun run app:check

      - name: Build app bundle
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: bun run build:app

      - name: Sync Android project
        run: bunx cap sync android

      - name: Prepare Android signing key
        env:
          ILLUXUS_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ILLUXUS_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ILLUXUS_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/illuxus-upload.jks"
          test -s "$RUNNER_TEMP/illuxus-upload.jks"

      - name: Build signed APK
        working-directory: android
        env:
          ILLUXUS_UPLOAD_STORE_FILE: ${{ runner.temp }}/illuxus-upload.jks
          ILLUXUS_UPLOAD_STORE_PASSWORD: ${{ secrets.ILLUXUS_UPLOAD_STORE_PASSWORD }}
          ILLUXUS_UPLOAD_KEY_ALIAS: ${{ secrets.ILLUXUS_UPLOAD_KEY_ALIAS }}
          ILLUXUS_UPLOAD_KEY_PASSWORD: ${{ secrets.ILLUXUS_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/release/app-release.apk release-assets/illuxus.apk
          cd release-assets
          sha256sum illuxus.apk > illuxus.apk.sha256

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              release-assets/illuxus.apk \
              release-assets/illuxus.apk.sha256 \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "illuxus Android $GITHUB_REF_NAME" \
              --generate-notes \
              --latest \
              release-assets/illuxus.apk \
              release-assets/illuxus.apk.sha256
          fi
