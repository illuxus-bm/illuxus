# Checks every push and pull request.
#
# Blocking: type check, lint (errors; warnings are reported), unit tests,
# database tests, the production build, and high or critical dependency
# advisories. All pass today and must keep passing.
name: CI

on:
  push:
    branches: [main, prisma-migration]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Same package manager and lockfile as the Vercel build.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun run test

      # Row security, grants and SQL functions, on an in-memory Postgres.
      # 087 and later run against the production schema dump.
      - name: Database tests
        run: |
          for t in supabase/tests/*.test.mjs; do
            echo "::group::$t"
            node "$t"
            echo "::endgroup::"
          done

      - name: Build
        run: bun run build
        # CI only checks that the bundle compiles. Never deploy this bundle;
        # use non-routable placeholders instead of requiring production secrets.
        env:
          VITE_SUPABASE_URL: https://ci.invalid
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-only-build-placeholder

      # The paste-into-Dashboard copies must match the functions' real code.
      - name: Dashboard function copies are current
        run: |
          bun run functions:inline
          git diff --exit-code -- 'supabase/functions/*/dashboard-inline.ts' \
            || (echo "Run 'npm run functions:inline' and commit the result." && exit 1)

      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
